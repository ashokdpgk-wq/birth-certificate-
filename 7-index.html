<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
}

/* LOGIN SCREEN */
#loginBox{
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:#111;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* INPUT */
input{
  padding:10px;
  margin-top:10px;
}

/* BUTTON */
button{
  padding:10px;
  margin-top:10px;
  cursor:pointer;
}

/* ERROR */
#msg{
  color:red;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>Enter Password</h2>
  <input type="password" id="pass" placeholder="Password">
  <button onclick="login()">Login</button>
  <p id="msg"></p>
</div>

<script>

// PASSWORD
const PASSWORD = "6987";

// LOGIN FUNCTION
function login(){
  let input = document.getElementById("pass").value;

  if(input === PASSWORD){

    /* 🔥 FULL PAGE REPLACE */
    document.body.innerHTML = `
      <div style="
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:black;
        color:red;
        font-size:32px;
        font-weight:bold;
        text-align:center;
        padding:20px;
      ">
        expired API key<br>
        please set a new API key in your system <br>then run again
      </div>
    `;

  } else {
    document.getElementById("msg").innerText = "Wrong Password!";
  }
}

// ENTER KEY SUPPORT
document.getElementById("pass").addEventListener("keypress", function(e){
  if(e.key === "Enter") login();
});

</script>

</body>
</html>
