<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ID Card XML QR Final</title>

<style>
body{
background:#ccc;
font-family:Arial;
text-align:center;
}

/* FORM */
.form{
background:#fff;
padding:10px;
margin:10px auto;
width:95%;
border:2px solid black;
}

input{
margin:5px;
padding:6px;
font-weight:bold;
}

/* CARD AREA */
#printArea{
display:flex;
gap:15px;
justify-content:center;
flex-wrap:wrap;
}

/* CARD */
.card{
width:350px;
height:220px;
border-radius:10px;
overflow:hidden;
box-shadow:0 0 10px rgba(0,0,0,0.5);
position:relative;
}

/* BACKGROUND */
.front{background:url('k.jpg') no-repeat center/cover;}
.back{background:url('k1.jpg') no-repeat center/cover;}

/* overlay */
.front::before,
.back::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:rgba(255,255,255,0.15);
}

.front *,.back *{position:relative;}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
padding:5px;
font-size:10px;
font-weight:bold;
}

/* PHOTOS */
.photo{
position:absolute;
left:14px;
top:52px;
width:93px;
height:110px;
border:1px solid #000;
object-fit:cover;
}

.photo2{
position:absolute;
top:50px;
right:10px;
width:40px;
height:45px;
border:1px solid #000;
object-fit:cover;
filter:grayscale(100%);
}

/* INFO */
.info{
position:absolute;
left:120px;
top:55px;
font-size:11px;
line-height:1.5;
text-align:left;
}

/* NUMBER */
.number{
position:absolute;
bottom:32px;
width:100%;
text-align:center;
font-weight:bold;
letter-spacing:2px;
}

/* TAG */
.tag{
position:absolute;
bottom:15px;
width:100%;
text-align:center;
font-size:12px;
}

/* BACK */
.address{
position:absolute;
left:25px;
top:70px;
width:180px;
font-size:11px;
  text-align:left;
word-break:break-word;
}

/* QR RIGHT CENTER */
.qr{
position:absolute;
right:15px;
top:48%;
transform:translateY(-50%);
width:110px;
height:110px;
background:#fff;
padding:3px;
border-radius:6px;
}

/* PRINT */
@media print{
body *{visibility:hidden;}
#printArea, #printArea *{visibility:visible;}
#printArea{
position:absolute;
top:0;
left:0;
}
}
</style>
</head>

<body>

<!-- FORM -->
<div class="form">
<input placeholder="Name" oninput="setVal('name',this.value)">
<input placeholder="Gender (M/F)" oninput="setVal('gender',this.value)">
<input placeholder="DOB (DD/MM/YYYY)" oninput="setVal('dob',this.value)">
<input placeholder="UID Number" oninput="setNumber(this.value)">
<input placeholder="Father Name" oninput="setVal('father',this.value)">
<input value="C/O: Krishna Sarkar, Kalirhat, Dhupguri, Jalpaiguri, West Bengal - 735210"placeholder="Address" oninput="setVal('address',this.value)">
<br>
📷 Photo: <input type="file" onchange="loadPhoto(event)">
<br>
<button onclick="printCard()">🖨 Print</button>
</div>

<!-- CARD -->
<div id="printArea">

<!-- FRONT -->
<div class="card front">

<div class="header">
<span>Government of India</span>
<span>ID CARD</span>
</div>

<img id="photo" class="photo">
<img id="photo2" class="photo2">

<div class="info">
<b id="name">YOUR NAME</b><br>
Gender: <span id="gender">M</span><br>
DOB: <span id="dob">01/01/2000</span>
</div>

<div class="number" id="number">0000 0000 0000</div>
<div class="tag">Unique Identification</div>

</div>

<!-- BACK -->
<div class="card back">

<div class="header">
<span>Authority</span>
<span>INDIA</span>
</div>

<div class="address" id="address">C/O: Krishna Sarkar, Kalirhat, Dhupguri, Jalpaiguri, West Bengal - 735210</div>

<canvas id="qr" class="qr"></canvas>

<div class="number" id="number2">0000 0000 0000</div>

</div>

</div>

<!-- QR LIB -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.0/qrcode.min.js"></script>

<script>

// SET VALUE
function setVal(id,val){
document.getElementById(id).innerText = val;
generateQR();
}

// NUMBER FORMAT
function setNumber(val){

val = val.replace(/\D/g,'').substring(0,12);
val = val.replace(/(\d{4})(?=\d)/g,'$1 ');

document.getElementById("number").innerText = val;
document.getElementById("number2").innerText = val;

generateQR();
}

// 🔥 XML DATA
function getXML(){

let uid = document.getElementById("number").innerText.replace(/\s/g,'');
let name = document.getElementById("name").innerText;
let gender = document.getElementById("gender").innerText;
let dob = document.getElementById("dob").innerText;
let father = document.getElementById("father") ? document.getElementById("father").innerText : "";
let address = document.getElementById("address").innerText;

return `<?xml version="1.0" encoding="UTF-8"?>
<PrintLetterBarcodeData 
uid="${uid}"
name="${name}"
gender="${gender}"
dob="${dob}"
co="S/O: ${father}"
loc="${address}"
dist="Jalpaiguri"
state="West Bengal"
pc="735210"
/>`;
}

// 🔥 QR GENERATE
function generateQR(){

let canvas = document.getElementById("qr");

canvas.width = 110;
canvas.height = 110;

let ctx = canvas.getContext("2d");
ctx.clearRect(0,0,canvas.width,canvas.height);

QRCode.toCanvas(canvas, getXML(), {
width:110,
margin:1
});
}

// PHOTO
function loadPhoto(e){
let file = URL.createObjectURL(e.target.files[0]);
photo.src = file;
photo2.src = file;
}

// LOAD
window.onload = function(){
generateQR();
}

// PRINT
function printCard(){
window.print();
}

</script>

</body>
</html>
